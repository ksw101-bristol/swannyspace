<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — SF Prediction Charts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');
  :root{--navy:#0d1b3e;--navy-dark:#081229;--gold:#e0a526;--chalk:#f4f1e8;--line:rgba(224,165,38,0.2);}
  *{box-sizing:border-box;}
  html{background:var(--navy);color-scheme:dark;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--navy)!important;
    background-image:repeating-linear-gradient(0deg,rgba(224,165,38,0.03) 0px,rgba(224,165,38,0.03) 40px,transparent 40px,transparent 80px);
    color:var(--chalk)!important;min-height:100vh;padding:24px 16px 64px;}
  .wrap{max-width:860px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:0.12em;text-transform:uppercase;color:rgba(224,165,38,0.6);text-decoration:none;margin-bottom:24px;}
  .back-link:hover{color:var(--gold);}
  .kicker{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;}
  h1{font-family:'Archivo Black',sans-serif;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.05;margin:0 0 10px;text-transform:uppercase;}
  header p{font-size:14px;line-height:1.6;color:rgba(244,241,232,0.7);margin:0 0 28px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
  .match-card{background:rgba(224,165,38,0.05);border:1px solid var(--line);border-radius:4px;padding:16px;}
  .match-header{display:flex;justify-content:space-between;align-items:center;
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;
    color:rgba(244,241,232,0.4);margin-bottom:8px;}
  .match-num{color:var(--gold);font-weight:700;}
  .fixture-name{font-family:'Archivo Black',sans-serif;font-size:1rem;text-transform:uppercase;
    margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .vs{font-family:'Space Mono',monospace;font-size:10px;color:rgba(244,241,232,0.3);}
  .actual-badge{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:3px;margin-left:auto;}
  .actual-ft{background:rgba(45,122,58,0.3);color:#5dc96d;}
  .actual-pending{background:rgba(244,241,232,0.08);color:rgba(244,241,232,0.3);}
  canvas{display:block;width:100%!important;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-family:'Space Mono',monospace;font-size:9px;
    letter-spacing:0.06em;text-transform:uppercase;color:rgba(244,241,232,0.4);}
  .legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;}
  footer{margin-top:40px;text-align:center;font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:0.12em;text-transform:uppercase;color:rgba(224,165,38,0.25);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="ko-index.html">← Back to home</a>
  <header>
    <p class="kicker">Knockout Stage · Semi-Finals · Prediction Charts</p>
    <h1>SF Prediction Charts</h1>
    <p>Where everyone's predictions landed for each semi-final. Blue = home win zone, red = away win zone, grey = draw zone. Gold crosshair = actual result.</p>
  </header>
  <div class="grid" id="charts"></div>
  <footer>World Cup 2026 · Knockout Stage · Prediction League</footer>
</div>
<script>
const fixtures = [
  { num:'29', meta:'Tue 14 Jul · 20:00', home:'France', away:'Spain',
    actualHome:null, actualAway:null,
    preds:[[3,1],[2,0],[3,1],[1,1],[2,1],[1,0],[2,1],[1,2],[1,1],[1,1],[2,1],[3,2],[1,0],[2,1],[3,1]] },
  { num:'30', meta:'Wed 15 Jul · 20:00', home:'England', away:'Argentina',
    actualHome:null, actualAway:null,
    preds:[[4,2],[3,1],[2,1],[3,0],[3,2],[3,1],[3,2],[2,0],[1,1],[2,1],[2,1],[1,3],[2,1],[2,2],[3,2]] },
];

function drawChart(canvas, f){
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.offsetWidth - 32;
  const SIZE = Math.min(W, 380);
  const PAD = {top:16, right:16, bottom:40, left:40};
  const plotW = SIZE - PAD.left - PAD.right;
  const plotH = SIZE - PAD.top - PAD.bottom;
  const allH = f.preds.map(p=>p[0]);
  const allA = f.preds.map(p=>p[1]);
  const maxH = Math.max(...allH, f.actualHome||0, 1);
  const maxA = Math.max(...allA, f.actualAway||0, 1);
  canvas.width = SIZE * dpr; canvas.height = SIZE * dpr;
  canvas.style.width = SIZE + 'px'; canvas.style.height = SIZE + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, SIZE, SIZE);
  function xp(v){ return PAD.left + (v/maxH)*plotW; }
  function yp(v){ return PAD.top + plotH - (v/maxA)*plotH; }
  for(let v=0;v<=maxH;v++){
    ctx.beginPath(); ctx.strokeStyle='rgba(244,241,232,0.1)'; ctx.lineWidth=1;
    ctx.moveTo(xp(v),PAD.top); ctx.lineTo(xp(v),PAD.top+plotH); ctx.stroke();
    ctx.fillStyle='rgba(244,241,232,0.45)'; ctx.font='10px "Space Mono",monospace'; ctx.textAlign='center';
    ctx.fillText(v, xp(v), PAD.top+plotH+14);
  }
  for(let v=0;v<=maxA;v++){
    ctx.beginPath(); ctx.strokeStyle='rgba(244,241,232,0.1)'; ctx.lineWidth=1;
    ctx.moveTo(PAD.left,yp(v)); ctx.lineTo(PAD.left+plotW,yp(v)); ctx.stroke();
    ctx.fillStyle='rgba(244,241,232,0.45)'; ctx.font='10px "Space Mono",monospace'; ctx.textAlign='right';
    ctx.fillText(v, PAD.left-6, yp(v)+4);
  }
  ctx.beginPath(); ctx.strokeStyle='rgba(244,241,232,0.25)'; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
  ctx.moveTo(xp(0),yp(0)); ctx.lineTo(xp(Math.min(maxH,maxA)),yp(Math.min(maxH,maxA))); ctx.stroke(); ctx.setLineDash([]);
  ctx.font='8px "Space Mono",monospace'; ctx.fillStyle='rgba(244,241,232,0.25)';
  ctx.textAlign='left'; ctx.fillText('AWAY WIN', PAD.left+4, PAD.top+14);
  ctx.textAlign='right'; ctx.fillText('HOME WIN', PAD.left+plotW-2, PAD.top+plotH-6);
  ctx.fillStyle='rgba(244,241,232,0.5)'; ctx.font='9px "Space Mono",monospace'; ctx.textAlign='center';
  ctx.fillText('HOME GOALS →', PAD.left+plotW/2, SIZE-4);
  ctx.save(); ctx.translate(10,PAD.top+plotH/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('AWAY GOALS →', 0, 0); ctx.restore();
  const counts = {};
  f.preds.forEach(([h,a])=>{ const k=h+','+a; counts[k]=(counts[k]||0)+1; });
  Object.entries(counts).forEach(([key,count])=>{
    const [h,a] = key.split(',').map(Number);
    const r = 7 + (count-1)*4;
    let fill,stroke;
    if(h>a){fill='rgba(74,144,217,0.75)';stroke='rgba(74,144,217,1)';}
    else if(a>h){fill='rgba(196,85,77,0.75)';stroke='rgba(196,85,77,1)';}
    else{fill='rgba(160,140,100,0.75)';stroke='rgba(200,180,130,1)';}
    ctx.beginPath(); ctx.arc(xp(h),yp(a),r,0,Math.PI*2);
    ctx.fillStyle=fill; ctx.fill();
    ctx.strokeStyle=stroke; ctx.lineWidth=1.5; ctx.stroke();
    if(count>1){
      ctx.fillStyle='rgba(244,241,232,0.95)';
      ctx.font='bold '+Math.min(11,r)+'px Inter,sans-serif';
      ctx.textAlign='center'; ctx.fillText(count,xp(h),yp(a)+4);
    }
  });
  if(f.actualHome !== null){
    const ax=xp(f.actualHome),ay=yp(f.actualAway);
    ctx.strokeStyle='rgba(224,165,38,1)'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(ax-14,ay); ctx.lineTo(ax+14,ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax,ay-14); ctx.lineTo(ax,ay+14); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(ax,ay,5,0,Math.PI*2);
    ctx.fillStyle='rgba(224,165,38,1)'; ctx.fill();
    ctx.fillStyle='rgba(224,165,38,1)';
    ctx.font='bold 10px "Space Mono",monospace'; ctx.textAlign='left';
    ctx.fillText(f.actualHome+'-'+f.actualAway, ax+8, ay-6);
  }
}

const container = document.getElementById('charts');
fixtures.forEach(f=>{
  const card = document.createElement('div');
  card.className = 'match-card';
  const actualHtml = f.actualHome !== null
    ? '<span class="actual-badge actual-ft">FT: '+f.actualHome+'–'+f.actualAway+'</span>'
    : '<span class="actual-badge actual-pending">Pending</span>';
  card.innerHTML = '<div class="match-header"><span class="match-num">Match '+f.num+'</span><span>'+f.meta+'</span></div>'
    +'<div class="fixture-name">'+f.home+' <span class="vs">vs</span> '+f.away+' '+actualHtml+'</div>'
    +'<canvas id="c'+f.num+'"></canvas>'
    +'<div class="legend"><span><span class="legend-dot" style="background:rgba(74,144,217,0.8)"></span>Home win</span>'
    +'<span><span class="legend-dot" style="background:rgba(196,85,77,0.8)"></span>Away win</span>'
    +'<span><span class="legend-dot" style="background:rgba(160,140,100,0.8)"></span>Draw</span></div>';
  container.appendChild(card);
});
function renderAll(){ fixtures.forEach(f=>drawChart(document.getElementById('c'+f.num),f)); }
renderAll();
window.addEventListener('resize', renderAll);
</script>
</body>
</html>
