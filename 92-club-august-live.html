<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>August · Live Scores · 92 Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16211c;
    --ink-soft: #5b675f;
    --paper: #ffffff;
    --panel: #f5f7f5;
    --line: #e2e6e2;
    --green: #1f7a4d;
    --green-deep: #145536;
    --amber: #d98c1f;
    --amber-soft: #fbeed9;
    --blue: #2b6ca3;
    --live: #1f9d55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center;
    padding: 36px 20px 26px;
    border-bottom: 1px solid var(--line);
  }
  .back-link {
    display: inline-block;
    color: var(--green);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 12px;
    text-decoration: none;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(24px, 6vw, 36px); }
  h1 span { color: var(--green); }
  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    color: var(--live);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 10px;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--live);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  #lastUpdated { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-top: 6px; }

  main { max-width: 860px; margin: 0 auto; padding: 28px 18px 64px; }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
  }

  /* Leaderboard */
  .leaderboard {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 40px;
  }
  .lb-row {
    display: grid;
    grid-template-columns: 40px 1fr 60px;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row.top { background: var(--amber-soft); }
  .lb-rank { font-family: 'IBM Plex Mono', monospace; color: var(--green); font-weight: 600; }
  .lb-name { font-weight: 600; }
  .lb-pts { font-family: 'IBM Plex Mono', monospace; text-align: right; color: var(--green); font-weight: 600; }

  /* Match cards */
  .match-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .match-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .match-league {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 10px;
    color: var(--amber);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .match-status {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .status-ns { color: var(--ink-soft); background: var(--line); }
  .status-live { color: var(--live); background: rgba(31,157,85,0.12); }
  .status-ft { color: var(--amber); background: var(--amber-soft); }
  .match-kickoff {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 8px;
  }
  .match-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--ink);
  }
  .match-teams .home { text-align: right; }
  .match-teams .away { text-align: left; }
  .match-teams .score {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--green);
    font-size: 22px;
    white-space: nowrap;
    text-align: center;
  }
  .preds-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px;
  }
  .pred-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-left: 3px solid transparent;
  }
  .pred-exact { border-left-color: var(--green); }
  .pred-gd { border-left-color: var(--amber); }
  .pred-result { border-left-color: var(--blue); }
  .pred-wrong { border-left-color: var(--line); opacity: 0.65; }
  .pred-chip .pname {
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .pred-chip .pscore {
    color: var(--ink);
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  footer {
    text-align: center;
    padding: 28px 20px 44px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }

  @media (max-width: 480px) {
    header { padding: 28px 16px 20px; }
    main { padding: 22px 14px 48px; }
    .match-teams {
      grid-template-columns: 1fr;
      justify-items: center;
      text-align: center;
      gap: 4px;
      font-size: 16px;
    }
    .match-teams .home,
    .match-teams .away { text-align: center; }
    .match-teams .score { font-size: 20px; order: 2; margin: 4px 0; }
    .match-teams .away { order: 3; }
    .preds-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="back-link">← Back to 92 Club</a>
  <h1>August <span>Live Scores</span></h1>
  <div class="subtitle" style="font-family:'IBM Plex Mono',monospace;color:var(--amber);font-size:12px;margin-top:6px;">Fri 28 – Sun 30 Aug 2026</div>
  <div class="live-pill"><span class="live-dot"></span> Updating every 60s</div>
  <div id="lastUpdated">Last updated: —</div>
</header>

<main>
  <div class="section-label">Leaderboard</div>
  <div class="leaderboard" id="leaderboard"></div>

  <div class="section-label">Fixtures &amp; Predictions</div>
  <div id="matchList"></div>

  <div class="legend">
    <span><i style="background:var(--green)"></i> 5 pts — exact score</span>
    <span><i style="background:var(--amber)"></i> 2 pts — result + goal difference</span>
    <span><i style="background:var(--blue)"></i> 1 pt — correct result</span>
    <span><i style="background:var(--line)"></i> 0 pts</span>
  </div>
</main>

<footer>The 92 Club · August Round · Swanny's Prediction League</footer>

<script>
/* ============================================================
   FIXTURES — edit this list each month to match the 10 games
   actually picked. searchHome/searchAway are used to match
   against the API response team names. If api-football uses a
   different name for a team, add altHomeTokens/altAwayTokens,
   e.g. altHomeTokens: ["USA"] for "United States".
   kickoff is shown on the card and is just for display — it
   doesn't affect the live lookup, which uses ROUND_FROM/ROUND_TO.
   ============================================================ */
const FIXTURES = [
  { id: 1, league: 39, leagueName: "Premier League", home: "Crystal Palace", away: "Manchester City", kickoff: "Fri 28 Aug, 20:00", searchHome: "Crystal Palace", searchAway: "Manchester City" },
  { id: 2, league: 40, leagueName: "Championship", home: "Wrexham", away: "Birmingham City", kickoff: "Fri 28 Aug, 20:00", searchHome: "Wrexham", searchAway: "Birmingham City", altAwayTokens: ["Birmingham"] },
  { id: 3, league: 39, leagueName: "Premier League", home: "Liverpool", away: "Nottingham Forest", kickoff: "Sat 29 Aug, 12:30", searchHome: "Liverpool", searchAway: "Nottingham Forest", altAwayTokens: ["Nott'm Forest", "Forest"] },
  { id: 4, league: 40, leagueName: "Championship", home: "Bristol City", away: "Portsmouth", kickoff: "Sat 29 Aug, 15:00", searchHome: "Bristol City", searchAway: "Portsmouth" },
  { id: 5, league: 41, leagueName: "League One", home: "Plymouth Argyle", away: "Bradford City", kickoff: "Sat 29 Aug, 15:00", searchHome: "Plymouth Argyle", searchAway: "Bradford City", altHomeTokens: ["Plymouth"], altAwayTokens: ["Bradford"] },
  { id: 6, league: 41, leagueName: "League One", home: "Notts County", away: "Burton Albion", kickoff: "Sat 29 Aug, 15:00", searchHome: "Notts County", searchAway: "Burton Albion", altAwayTokens: ["Burton"] },
  { id: 7, league: 42, leagueName: "League Two", home: "Crawley Town", away: "Bristol Rovers", kickoff: "Sat 29 Aug, 15:00", searchHome: "Crawley Town", searchAway: "Bristol Rovers", altHomeTokens: ["Crawley"] },
  { id: 8, league: 42, leagueName: "League Two", home: "York City", away: "Exeter City", kickoff: "Sat 29 Aug, 15:00", searchHome: "York City", searchAway: "Exeter City", altHomeTokens: ["York"], altAwayTokens: ["Exeter"] },
  { id: 9, league: 39, leagueName: "Premier League", home: "Chelsea", away: "Brighton & Hove Albion", kickoff: "Sun 30 Aug, 14:00", searchHome: "Chelsea", searchAway: "Brighton & Hove Albion", altAwayTokens: ["Brighton"] },
  { id: 10, league: 39, leagueName: "Premier League", home: "Manchester United", away: "Ipswich Town", kickoff: "Sun 30 Aug, 16:30", searchHome: "Manchester United", searchAway: "Ipswich Town", altAwayTokens: ["Ipswich"] },
];

/* ============================================================
   PREDICTIONS — final entrant predictions for the August round.
   Key = fixture id, value = { player: "H-A" }. 13 confirmed
   entrants (Vicki Walsh and Chris Hunt did not enter this season;
   "The Mays" entered as "Lee May").
   ============================================================ */
const PREDICTIONS = {
  1: { "Kirk Walsh": "0-2", "Lee May": "1-2", "Mike Budd": "1-2", "Richard Boyce": "1-1", "Jordy Chalmers": "2-2", "Steve Kenna": "1-3", "Cameron Walsh": "1-2", "James Boyce": "0-3", "Cathy & Oliver": "1-2", "Lee Grainger": "1-1", "Jason Parsons": "1-2", "Dave Budd": "1-3", "Elliot Walsh": "0-2" },
  2: { "Kirk Walsh": "1-1", "Lee May": "2-1", "Mike Budd": "1-1", "Richard Boyce": "3-0", "Jordy Chalmers": "1-2", "Steve Kenna": "2-1", "Cameron Walsh": "1-1", "James Boyce": "2-1", "Cathy & Oliver": "1-1", "Lee Grainger": "2-2", "Jason Parsons": "2-1", "Dave Budd": "1-1", "Elliot Walsh": "3-1" },
  3: { "Kirk Walsh": "1-0", "Lee May": "2-0", "Mike Budd": "2-1", "Richard Boyce": "1-0", "Jordy Chalmers": "2-0", "Steve Kenna": "2-0", "Cameron Walsh": "3-1", "James Boyce": "2-0", "Cathy & Oliver": "2-1", "Lee Grainger": "3-1", "Jason Parsons": "2-1", "Dave Budd": "2-0", "Elliot Walsh": "3-0" },
  4: { "Kirk Walsh": "1-1", "Lee May": "2-1", "Mike Budd": "2-0", "Richard Boyce": "3-1", "Jordy Chalmers": "2-1", "Steve Kenna": "3-0", "Cameron Walsh": "2-1", "James Boyce": "1-0", "Cathy & Oliver": "1-1", "Lee Grainger": "2-1", "Jason Parsons": "2-1", "Dave Budd": "1-0", "Elliot Walsh": "2-0" },
  5: { "Kirk Walsh": "2-1", "Lee May": "2-0", "Mike Budd": "0-2", "Richard Boyce": "2-2", "Jordy Chalmers": "1-2", "Steve Kenna": "1-2", "Cameron Walsh": "2-1", "James Boyce": "2-0", "Cathy & Oliver": "1-1", "Lee Grainger": "2-1", "Jason Parsons": "2-1", "Dave Budd": "1-2", "Elliot Walsh": "1-1" },
  6: { "Kirk Walsh": "2-1", "Lee May": "1-0", "Mike Budd": "3-1", "Richard Boyce": "2-1", "Jordy Chalmers": "1-1", "Steve Kenna": "2-1", "Cameron Walsh": "2-0", "James Boyce": "2-1", "Cathy & Oliver": "1-1", "Lee Grainger": "1-1", "Jason Parsons": "2-1", "Dave Budd": "1-0", "Elliot Walsh": "2-1" },
  7: { "Kirk Walsh": "1-3", "Lee May": "2-0", "Mike Budd": "2-2", "Richard Boyce": "4-1", "Jordy Chalmers": "1-0", "Steve Kenna": "1-2", "Cameron Walsh": "1-2", "James Boyce": "0-2", "Cathy & Oliver": "1-1", "Lee Grainger": "1-2", "Jason Parsons": "1-2", "Dave Budd": "1-2", "Elliot Walsh": "3-0" },
  8: { "Kirk Walsh": "2-0", "Lee May": "2-1", "Mike Budd": "2-1", "Richard Boyce": "3-1", "Jordy Chalmers": "2-0", "Steve Kenna": "2-0", "Cameron Walsh": "2-0", "James Boyce": "1-0", "Cathy & Oliver": "1-0", "Lee Grainger": "1-2", "Jason Parsons": "2-1", "Dave Budd": "1-1", "Elliot Walsh": "1-2" },
  9: { "Kirk Walsh": "2-0", "Lee May": "2-1", "Mike Budd": "3-2", "Richard Boyce": "1-2", "Jordy Chalmers": "2-1", "Steve Kenna": "3-1", "Cameron Walsh": "3-1", "James Boyce": "2-0", "Cathy & Oliver": "1-1", "Lee Grainger": "2-1", "Jason Parsons": "2-1", "Dave Budd": "2-0", "Elliot Walsh": "2-0" },
  10: { "Kirk Walsh": "3-1", "Lee May": "2-1", "Mike Budd": "2-0", "Richard Boyce": "3-0", "Jordy Chalmers": "3-1", "Steve Kenna": "3-0", "Cameron Walsh": "4-1", "James Boyce": "2-0", "Cathy & Oliver": "2-0", "Lee Grainger": "3-0", "Jason Parsons": "2-1", "Dave Budd": "3-0", "Elliot Walsh": "3-1" },
};

const ROUND_FROM = "2026-08-28";
const ROUND_TO = "2026-08-30";
const POLL_INTERVAL_MS = 60000;

function findMatch(fixture, apiMatches) {
  const homeTokens = [fixture.searchHome, ...(fixture.altHomeTokens || [])];
  const awayTokens = [fixture.searchAway, ...(fixture.altAwayTokens || [])];
  return apiMatches.find(m =>
    homeTokens.some(t => m.home.includes(t) || t.includes(m.home)) &&
    awayTokens.some(t => m.away.includes(t) || t.includes(m.away))
  );
}

function pointsFor(predHome, predAway, actualHome, actualAway) {
  if (actualHome === null || actualHome === undefined || actualAway === null || actualAway === undefined) return null;
  if (predHome === actualHome && predAway === actualAway) return 5;
  const predGD = predHome - predAway;
  const actualGD = actualHome - actualAway;
  if (predGD === actualGD) return 2;
  const sign = n => (n > 0 ? 1 : n < 0 ? -1 : 0);
  if (sign(predGD) === sign(actualGD)) return 1;
  return 0;
}

function statusLabel(status) {
  if (status === 'NS') return { text: 'Not started', cls: 'status-ns' };
  if (status === 'FT') return { text: 'Full time', cls: 'status-ft' };
  if (['1H', '2H', 'HT', 'ET'].includes(status)) return { text: 'Live', cls: 'status-live' };
  return { text: status, cls: 'status-ns' };
}

async function loadScores() {
  let apiMatches = [];
  try {
    const res = await fetch(`/.netlify/functions/scores?from=${ROUND_FROM}&to=${ROUND_TO}`);
    const data = await res.json();
    apiMatches = data.matches || [];
  } catch (err) {
    console.error('Failed to fetch live scores', err);
  }

  const playerTotals = {};
  const matchListEl = document.getElementById('matchList');
  matchListEl.innerHTML = '';

  FIXTURES.forEach(fixture => {
    const live = findMatch(fixture, apiMatches);
    const homeScore = live ? (live.liveHomeScore ?? live.homeScore) : null;
    const awayScore = live ? (live.liveAwayScore ?? live.awayScore) : null;
    const status = live ? statusLabel(live.status) : statusLabel('NS');

    const preds = PREDICTIONS[fixture.id] || {};
    const chips = Object.entries(preds).map(([player, pred]) => {
      const [ph, pa] = pred.split('-').map(Number);
      const pts = pointsFor(ph, pa, homeScore, awayScore);
      playerTotals[player] = (playerTotals[player] || 0) + (pts || 0);

      let cls = 'pred-wrong';
      if (pts === 5) cls = 'pred-exact';
      else if (pts === 2) cls = 'pred-gd';
      else if (pts === 1) cls = 'pred-result';

      return `<div class="pred-chip ${cls}"><span class="pname">${player}</span><span class="pscore">${pred}${pts !== null ? ` (${pts})` : ''}</span></div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="match-top">
        <span class="match-league">${fixture.leagueName}</span>
        <span class="match-status ${status.cls}">${status.text}</span>
      </div>
      <div class="match-kickoff">${fixture.kickoff || ''}</div>
      <div class="match-teams">
        <span class="home">${fixture.home}</span>
        <span class="score">${homeScore ?? '–'} : ${awayScore ?? '–'}</span>
        <span class="away">${fixture.away}</span>
      </div>
      <div class="preds-grid">${chips || '<span style="color:#5b675f;font-family:\'IBM Plex Mono\',monospace;font-size:12px;">No predictions logged yet</span>'}</div>
    `;
    matchListEl.appendChild(card);
  });

  const lbEl = document.getElementById('leaderboard');
  const sorted = Object.entries(playerTotals).sort((a, b) => b[1] - a[1]);
  lbEl.innerHTML = sorted.length
    ? sorted.map(([player, pts], i) => `
        <div class="lb-row ${i === 0 ? 'top' : ''}">
          <span class="lb-rank">${i + 1}</span>
          <span class="lb-name">${player}</span>
          <span class="lb-pts">${pts}</span>
        </div>`).join('')
    : '<div class="lb-row"><span class="lb-name">No predictions logged yet</span></div>';

  document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString('en-GB');
}

loadScores();
setInterval(loadScores, POLL_INTERVAL_MS);
</script>

</body>
</html>
